<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TurfKit — Book the turf. Split the bill. Run the game.</title>
<meta name="description" content="TurfKit finds 5-a-side and 7-a-side turfs across Bengaluru, plans your game, splits the cost per head, sets the formation and keeps your match log.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#faf3e7; --paper2:#f2e7d0; --card:#fffaf1; --ink:#241a12; --ink2:#5c4a36; --ink3:#8a7458;
  --bronze:#b4762a; --gold:#d9a441; --terra:#c05b2e; --terra-d:#9c4520; --line:#e3d3b8; --line2:#d8c49a;
  --pitch:#2e5d3a; --pitch2:#26502f; --pitchline:rgba(250,243,231,.85);
  --ok:#2e7d4f; --warn:#b4762a; --bad:#b3361f;
  --shadow:0 10px 30px rgba(36,26,18,.12); --shadow2:0 4px 14px rgba(36,26,18,.10);
  --r:18px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,.serif{font-family:Fraunces,Georgia,serif;line-height:1.08;margin:0}
p{margin:0 0 10px}
a{color:var(--terra)}
button{font-family:inherit;cursor:pointer}
img{max-width:100%;display:block}
.wrap{max-width:1060px;margin:0 auto;padding:0 18px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--bronze)}
.helper{color:var(--ink2);font-size:14px}
.muted{color:var(--ink3)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:12px 20px;font-weight:700;font-size:15px;background:var(--terra);color:#fff;box-shadow:var(--shadow2)}
.btn:hover{background:var(--terra-d)}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line2);box-shadow:none}
.btn.small{padding:8px 14px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow2)}
.sec{padding:34px 0 8px}
.sec h2{font-size:30px;font-weight:900;margin:6px 0 8px}
.sec .sub{color:var(--ink2);max-width:640px;margin:0 0 18px}
.rule{height:3px;width:56px;background:linear-gradient(90deg,var(--gold),var(--terra));border-radius:3px;margin:10px 0 16px}
/* ---------- intro ---------- */
#intro{position:fixed;inset:0;z-index:200;background:radial-gradient(120% 100% at 50% 0%,#3a2a18 0%,#241a12 55%,#160f08 100%);color:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;transition:opacity .6s ease,visibility .6s}
#intro.done{opacity:0;visibility:hidden;pointer-events:none}
#intro .ball{width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0%,#f3e8d3 55%,#d8c49a 100%);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 6px rgba(217,164,65,.25),0 18px 50px rgba(0,0,0,.5);animation:bounce 1.1s ease-in-out infinite alternate}
#intro .ball svg{width:58px;height:58px}
@keyframes bounce{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-16px) rotate(8deg)}}
#intro h1{font-size:52px;font-weight:900;letter-spacing:.02em;margin:22px 0 6px}
#intro h1 .st{display:block;opacity:0;transform:translateY(14px);animation:rise .7s ease forwards}
#intro h1 .st:nth-child(1){animation-delay:.15s}
#intro h1 .st:nth-child(2){animation-delay:.45s;color:var(--gold)}
#intro h1 .st:nth-child(3){animation-delay:.75s;font-size:24px;letter-spacing:.08em}
@keyframes rise{to{opacity:1;transform:none}}
#intro p{color:#e8dcc4;max-width:420px;margin:8px 0 0}
#intro .prog{width:min(300px,80vw);height:5px;background:rgba(250,243,231,.18);border-radius:99px;margin:26px 0 14px;overflow:hidden}
#intro .prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--terra));border-radius:99px;transition:width .2s linear}
#skipIntro{position:absolute;right:18px;top:18px;background:rgba(250,243,231,.12);color:var(--paper);border:1px solid rgba(250,243,231,.35);border-radius:999px;padding:9px 16px;font-weight:700;font-size:13px}
/* ---------- header ---------- */
header.top{position:sticky;top:0;z-index:60;background:rgba(250,243,231,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;padding:12px 0}
.logo{display:flex;align-items:center;gap:10px;font-family:Fraunces,serif;font-weight:900;font-size:24px;text-decoration:none;color:var(--ink)}
.logo .mark{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#e9dcc0 60%,#cbb27f);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 2px rgba(36,26,18,.15)}
.logo .mark svg{width:24px;height:24px}
.top nav{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
.top nav a{color:var(--ink2);text-decoration:none;font-weight:600;font-size:13.5px;padding:8px 10px;border-radius:999px}
.top nav a:hover{background:var(--paper2);color:var(--ink)}
/* ---------- scoreboard strip ---------- */
.scoreboard{background:var(--ink);color:var(--paper);border-radius:var(--r);margin:18px 0 0;overflow:hidden;box-shadow:var(--shadow)}
.scoreboard .sb-in{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:16px 20px}
.sb-label{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.sb-game{font-family:Fraunces,serif;font-size:21px;font-weight:700}
.sb-meta{color:#d8c9ae;font-size:13.5px}
.sb-cd{margin-left:auto;display:flex;align-items:center;gap:10px}
.sb-cd .t{text-align:center}
.sb-cd .t b{display:block;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.sb-cd .t span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#cbb894}
